site:
  id: krakow
  name: "Kraków Lab"
  type: lab
  timezone: Europe/Warsaw

node:
  id: krakow-lab-t620
  role: hub

modules:
  rtl433:
    enabled: true
    mode: jsonl_replay
    replay_path: ./data/raw_data/rtl433-live.jsonl

  system_metrics:
    enabled: true
    interval_seconds: 60

storage:
  sqlite_path: ./data/outpost.sqlite

logging:
  level: INFO
  mode: stdout_json

api:
  host: 127.0.0.1
  port: 8000
  public_enabled: true
  internal_enabled: true

devices:
  - key: rtl433:inFactory-TH:1:166
    name: "Kraków weather shield"
    type: weather_sensor
    public: true
    match:
      source: rtl433
      model: inFactory-TH
      id: 166
      channel: 1
    metrics:
      - temperature
      - humidity

dashboard:
  cards:
    - current_weather
    - system_status
