site:
  id: glebokie
  name: "Głębokie Outpost"
  type: field
  timezone: Europe/Warsaw

node:
  id: glebokie-core-t620
  role: hub

modules:
  rtl433:
    enabled: true
    mode: mqtt
    mqtt_topic: rtl_433/+/events

  system_metrics:
    enabled: true
    interval_seconds: 60

  allsky:
    enabled: false

storage:
  sqlite_path: /var/lib/sky-weather-outpost/outpost.sqlite

archive:
  nas_enabled: true
  path: /mnt/nas/outpost

logging:
  level: INFO
  mode: stdout_json

api:
  host: 127.0.0.1
  port: 8000
  public_enabled: true
  internal_enabled: true

devices: []

dashboard:
  cards:
    - current_weather
    - wind_rain
    - allsky_latest
    - top_night
    - system_status
