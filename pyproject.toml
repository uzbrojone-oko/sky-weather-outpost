[project]
name = "sky-weather-outpost"
version = "0.1.0"
description = "Configurable local outpost hub for telemetry, environmental sensors, node health and future sky/media observations."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
]

[project.scripts]
outpost = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
